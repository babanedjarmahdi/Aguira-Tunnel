services:
  postgres:
    image: postgres:16-alpine
    container_name: terraflow_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: terraflow
      POSTGRES_PASSWORD: terraflow
      POSTGRES_DB: terraflow
    ports:
      - "5432:5432"
    volumes:
      - terraflow_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terraflow -d terraflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  terraflow_pgdata:
